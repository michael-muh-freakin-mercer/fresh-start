# Added 2026-11-12. On battery, closing the lid sleeps then hibernates after
# HibernateDelaySec (see /etc/systemd/sleep.conf.d/50-suspend-then-hibernate.conf).
# On AC it stays a plain suspend. Docked stays at the default (ignore).
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
